# Builds the site and checks the result on every push and pull request.
# deploy.yml publishes it.

name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Reading the repository is all this needs. Declared here rather than left to
# the repository default, which is a setting and can be changed.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Build
        run: node scripts/build.mjs --strict
      - name: Lint translations
        run: node scripts/lint-translations.mjs
      - name: Check
        run: node scripts/check.mjs --strict
