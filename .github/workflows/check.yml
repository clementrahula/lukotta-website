# Builds the site and checks the result on every push and pull request.
# deploy.yml publishes it.

name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build
        run: node scripts/build.mjs --strict
      - name: Lint translations
        run: node scripts/lint-translations.mjs
      - name: Check
        run: node scripts/check.mjs --strict
