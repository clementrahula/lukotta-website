# Builds public/ and publishes it to GitHub Pages.
#
# Manual for now. GitHub Pages serves a private repository only on a paid plan,
# so while this one is private every run would fail at configure-pages.
#
# To go live: make the repository public, then uncomment the push trigger
# below. configure-pages runs with enablement: true, so the first run turns
# Pages on. AGENTS.md has the Cloudflare records and the SSL mode required;
# Flexible produces a redirect loop.

name: Deploy

on:
  # push:
  #   branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build
        run: node scripts/build.mjs

      # --strict fails while any language still carries the English text.
      # 37 copies of one page is duplicate content.
      - name: Check
        run: node scripts/check.mjs --strict

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
