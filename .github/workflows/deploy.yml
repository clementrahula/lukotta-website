# Builds public/ and publishes it to GitHub Pages.
#
# Runs on every push to main. AGENTS.md has the Cloudflare records and the SSL
# mode required; Flexible produces a redirect loop.

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Full history: the sitemap dates each language from the commit that
      # last touched its content file.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      # --strict here refuses missing content files, English screenshot
      # fallbacks, mismatched screenshot pairs and unused keys.
      - name: Build
        run: node scripts/build.mjs --strict

      # Placeholder integrity and product names left verbatim. A mangled
      # {version} reaches the page as a literal brace; nothing else sees it.
      - name: Lint translations
        run: node scripts/lint-translations.mjs

      # --strict fails while any language still carries the English text,
      # or has no page at all. 37 copies of one page is duplicate content.
      - name: Check
        run: node scripts/check.mjs --strict
      - name: Check that no published address moved
        run: node scripts/check-slugs.mjs

      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      # After the deploy, not before: IndexNow fetches the key from the live
      # site to verify it, and tells the engines to come and read pages that
      # have to be there when they arrive.
      #
      # Google does not take part in IndexNow. This is Bing, Yandex, Seznam and
      # Naver, and it is in addition to Search Console rather than instead of
      # it.
      #
      # continue-on-error: nothing about the site is wrong if a search engine
      # was busy, and a deploy that fails because a third party returned 500
      # is worse than one that says so and carries on.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Build the sitemap this submission reads
        run: node scripts/build.mjs
      - name: Tell IndexNow
        continue-on-error: true
        run: node scripts/indexnow.mjs

      # The worker answers Accept: text/markdown with the .md twin the build
      # wrote beside each page, and adds Vary: Accept to everything so a cache
      # cannot serve one variant to a caller who asked for the other.
      #
      # It deploys after the pages, never before: the worker fetches the twin
      # from the origin, and a worker live against an origin that has not been
      # updated yet would serve the previous markdown.
      #
      # CF_WORKERS_TOKEN needs Workers Scripts: Edit and Workers Routes: Edit on
      # this zone alone. It is deliberately not the cache-purge token: different
      # job, different rotation. Without it the step says so and the site is
      # still deployed, serving HTML to everybody, which is what it did before.
      - name: Deploy the markdown negotiator
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_WORKERS_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::CF_WORKERS_TOKEN or CF_ACCOUNT_ID is not set."
            echo "The markdown negotiator cannot deploy without them, and a"
            echo "deploy that skipped it quietly is how the site goes on serving"
            echo "HTML to callers asking for markdown with nobody noticing."
            exit 1
          fi
          npx --yes wrangler@4 deploy --config worker/wrangler.toml

      # Cloudflare holds the pages at its edge, so a deploy that does not tell
      # it otherwise is invisible until the cache expires. The stylesheet and
      # the script carry a digest and can be left alone; it is the HTML that
      # goes stale. Set CF_ZONE_ID and CF_API_TOKEN as repository secrets, with
      # a token holding Zone → Cache Purge on this zone alone. Without them the
      # step says so and the deploy still counts as done.
      - name: Purge the Cloudflare cache
        env:
          CF_ZONE: ${{ secrets.CF_ZONE_ID }}
          CF_TOKEN: ${{ secrets.CF_API_TOKEN }}
        run: |
          if [ -z "$CF_ZONE" ] || [ -z "$CF_TOKEN" ]; then
            echo "No Cloudflare credentials set. Skipping the purge; the edge will"
            echo "serve the previous pages until its own cache expires."
            exit 0
          fi
          response=$(curl -sS -X POST \
            "https://api.cloudflare.com/client/v4/zones/$CF_ZONE/purge_cache" \
            -H "Authorization: Bearer $CF_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"purge_everything":true}')
          echo "$response"
          echo "$response" | grep -q '"success":true' || {
            echo "The purge was refused. The site is deployed but the edge is stale."
            exit 1
          }

      # A worker in front of the whole zone is a single point of failure the
      # moment the account's daily invocation allowance runs out. Cloudflare
      # decides what happens then per route, and wrangler cannot express the
      # setting, so it is invisible from this repository: the deploy above
      # rewrites the routes on every push and nothing here has ever looked at
      # what mode they came back in. This reports it. It changes nothing.
      # The worker is routed at lukotta.com/*, so it is in front of every
      # request the site serves. The account is on the Workers free plan, which
      # allows 100,000 invocations a day, and what happens after that is a
      # per-route setting:
      #
      #   fail closed  every request gets a Cloudflare error page until
      #                midnight UTC. The site is down.
      #   fail open    the worker is bypassed and the origin serves. Agents
      #                asking for markdown get HTML and a 404 under /de/ comes
      #                back in English, and nothing else changes.
      #
      # Nothing this worker does is a security check, so there is no version of
      # this where an error page is the better answer. Cloudflare creates routes
      # fail closed, wrangler has no way to say otherwise (workers-sdk#2078),
      # and the deploy above rewrites the routes on every push -- so this cannot
      # be a thing somebody once clicked in the dashboard. It is set here, after
      # every deploy, and the job fails if it did not take.
      - name: Keep the routes failing open
        env:
          CF_ZONE: ${{ secrets.CF_ZONE_ID }}
          CF_TOKEN: ${{ secrets.CF_WORKERS_TOKEN }}
        run: |
          if [ -z "$CF_ZONE" ] || [ -z "$CF_TOKEN" ]; then
            echo "::error::CF_ZONE_ID or CF_WORKERS_TOKEN is not set."
            echo "The routes cannot be checked, so the site's behaviour at the"
            echo "invocation ceiling is unknown. That is not something to guess at."
            exit 1
          fi
          api="https://api.cloudflare.com/client/v4/zones/$CF_ZONE/workers/routes"
          routes=$(curl -sS "$api" -H "Authorization: Bearer $CF_TOKEN")
          echo "$routes" | jq -e '.success' >/dev/null || { echo "$routes" | jq -c '.errors'; exit 1; }
          for id in $(echo "$routes" | jq -r '.result[] | select(.script == "lukotta-markdown" and .request_limit_fail_open != true) | .id'); do
            pattern=$(echo "$routes" | jq -r --arg id "$id" '.result[] | select(.id == $id) | .pattern')
            echo "  setting $pattern to fail open"
            body=$(jq -nc --arg p "$pattern" '{pattern: $p, script: "lukotta-markdown", request_limit_fail_open: true}')
            curl -sS -X PUT "$api/$id" -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" --data "$body" | jq -c '{success, errors}'
          done
          after=$(curl -sS "$api" -H "Authorization: Bearer $CF_TOKEN")
          echo "$after" | jq -c '.result[] | {pattern, script, request_limit_fail_open}'
          echo "$after" | jq -e '[.result[] | select(.script == "lukotta-markdown") | .request_limit_fail_open] | length > 0 and all' >/dev/null || {
            echo "::error::A route is still failing closed. If the daily invocation"
            echo "allowance runs out, the site returns error pages instead of falling"
            echo "back to the origin."
            exit 1
          }

      # Every request to the zone is an invocation, cached or not, so a single
      # page view costs about fourteen: the page, the stylesheet, the script,
      # five icons, two screenshots and the font subsets. Thirteen of those are
      # files the worker looks at once and hands straight back.
      #
      # A route with no worker on it negates a less specific one, so /assets/*
      # takes the fonts, icons, brand marks and screenshots off the worker
      # entirely. The stylesheet and the script sit at the root and carry a
      # digest of their contents, and Cloudflare does not allow a wildcard in
      # the middle of a pattern -- lukotta.com/*.css is not a legal route -- so
      # they need their exact names, which change whenever they do. The names
      # are read out of the build rather than typed here, and a route left
      # behind by an older digest is removed.
      - name: Keep the assets out of the worker
        env:
          CF_ZONE: ${{ secrets.CF_ZONE_ID }}
          CF_TOKEN: ${{ secrets.CF_WORKERS_TOKEN }}
        run: |
          api="https://api.cloudflare.com/client/v4/zones/$CF_ZONE/workers/routes"
          css=$(cd public && ls styles.*.css 2>/dev/null) || { echo "::error::no built stylesheet in public/; the build must run before this."; exit 1; }
          js=$(cd public && ls script.*.js 2>/dev/null) || { echo "::error::no built script in public/."; exit 1; }
          echo "  fingerprinted this build: $css $js"
          want=$(for h in lukotta.com www.lukotta.com; do echo "$h/assets/*"; echo "$h/$css"; echo "$h/$js"; done | sort)
          routes=$(curl -sS "$api" -H "Authorization: Bearer $CF_TOKEN")
          echo "$routes" | jq -e '.success' >/dev/null || { echo "$routes" | jq -c '.errors'; exit 1; }
          have=$(echo "$routes" | jq -r '.result[] | select(.script == null or .script == "") | .pattern' | sort)
          for pattern in $(comm -23 <(echo "$want") <(echo "$have")); do
            echo "  excluding $pattern"
            # script is optional, and omitting it is what makes the route an
            # exclusion. Sending "" asks for a worker named empty string, which
            # the API rejects with 10019.
            result=$(curl -sS -X POST "$api" -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" --data "$(jq -nc --arg p "$pattern" '{pattern: $p}')")
            echo "$result" | jq -e '.success' >/dev/null || result=$(curl -sS -X POST "$api" -H "Authorization: Bearer $CF_TOKEN" -H "Content-Type: application/json" --data "$(jq -nc --arg p "$pattern" '{pattern: $p, script: null}')")
            echo "$result" | jq -c '{success, errors}'
          done
          # A digest that is no longer the current one leaves a route pointing at
          # a file that does not exist. Only ever an exclusion, only ever one of
          # these two names: a route with a worker on it is never touched here.
          for id in $(echo "$routes" | jq -r --arg want "$want" '($want | split("\n")) as $w | .result[] | select((.script == null or .script == "") and (.pattern | test("^(www\\.)?lukotta\\.com/(styles|script)\\.[a-z0-9]+\\.(css|js)$")) and (.pattern | IN($w[]) | not)) | .id'); do
            echo "  removing a route left by an older digest"
            curl -sS -X DELETE "$api/$id" -H "Authorization: Bearer $CF_TOKEN" | jq -c '{success, errors}'
          done
          after=$(curl -sS "$api" -H "Authorization: Bearer $CF_TOKEN")
          echo "$after" | jq -c '.result[] | {pattern, script}'
          missing=$(comm -23 <(echo "$want") <(echo "$after" | jq -r '.result[] | select(.script == null or .script == "") | .pattern' | sort))
          [ -z "$missing" ] || { echo "::error::still routed through the worker:"; echo "$missing"; exit 1; }

      # The deploy said it succeeded. This asks the live site whether it did.
      #
      # Everything up to here can pass while the one thing the worker exists
      # for does not work: a route that did not attach, a propagation that has
      # not landed, an origin fetch that fails. So the job ends by making the
      # request an agent would make and checking the answer, and fails if it is
      # still HTML.
      #
      # It runs after the purge, because the edge would otherwise hand back the
      # HTML it cached before the worker existed.
      - name: Check that markdown negotiation actually works
        run: |
          url="https://lukotta.com/"
          for attempt in 1 2 3 4 5; do
            type=$(curl -sS -o /dev/null -w '%{content_type}' \
                     -H 'Accept: text/markdown' "$url" || true)
            vary=$(curl -sSI -H 'Accept: text/markdown' "$url" \
                     | tr 'A-Z' 'a-z' | grep '^vary:' || true)
            echo "attempt $attempt: content-type=$type  $vary"
            case "$type" in
              text/markdown*)
                case "$vary" in
                  *accept*)
                    echo "Markdown negotiation is live and Vary names Accept."
                    exit 0 ;;
                esac
                echo "::warning::Serving markdown but Vary does not name Accept."
                echo "A cache can hand this to a browser. Check the worker."
                exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::Asked for text/markdown and got '$type'."
          echo "The worker is deployed but not answering on this route. The site"
          echo "is up and serving HTML; nothing is broken for people, but the"
          echo "markdown twins are unreachable to anything that asks for them."
          exit 1
